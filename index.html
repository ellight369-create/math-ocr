    function showToast(msg, type = 'info') {

    function loadApiKey() {

    function saveApiKey(key) {

      try {
        localStorage.setItem(STORAGE_KEY, state.apiKey);

    function updateApiKeyBadge() {
      if (state.apiKey) {

    // --- Safe Arithmetic Evaluator (+, -, *, x, ×, /, ÷, parentheses) ---
    function evaluateExpression(input) {
      if (!input || !String(input).trim()) return null;
      const normalized = String(input)
        .replace(/,/g, '')
        .replace(/[×xX]/g, '*')
        .replace(/÷/g, '/')
        .replace(/＋/g, '+')
        .replace(/－/g, '-')
        .replace(/（/g, '(')
        .replace(/）/g, ')')
        .replace(/\s+/g, '');

      if (!/^[0-9+\-*/().]+$/.test(normalized)) return null;

      let pos = 0;
      function parseExpr() {
        let x = parseTerm();
        while (pos < normalized.length) {
          if (normalized[pos] === '+') { pos++; x += parseTerm(); }
          else if (normalized[pos] === '-') { pos++; x -= parseTerm(); }
          else break;
        }
        return x;
      }
      function parseTerm() {
        let x = parseFactor();
        while (pos < normalized.length) {
          if (normalized[pos] === '*') { pos++; x *= parseFactor(); }
          else if (normalized[pos] === '/') {
            pos++;
            const d = parseFactor();
            if (d === 0) throw new Error('Divide by zero');
            x /= d;
          } else break;
        }
        return x;
      }
      function parseFactor() {
        if (normalized[pos] === '+') { pos++; return parseFactor(); }
        if (normalized[pos] === '-') { pos++; return -parseFactor(); }
        if (normalized[pos] === '(') {
          pos++;
          const x = parseExpr();
          if (normalized[pos] === ')') pos++;
          return x;
        }
        const start = pos;
        while (pos < normalized.length && ((normalized[pos] >= '0' && normalized[pos] <= '9') || normalized[pos] === '.')) {
          pos++;
        }
        if (start === pos) throw new Error('Invalid token');
        return parseFloat(normalized.slice(start, pos));
      }

      try {
        const val = parseExpr();
        if (pos !== normalized.length || !Number.isFinite(val)) return null;
        return val;
      } catch (_) {
        return null;
      }
    }

    function formatExpressionDisplay(expr) {
      return String(expr)
        .replace(/[*xX]/g, ' × ')
        .replace(/\//g, ' ÷ ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function formatNum(n) {
      if (!Number.isFinite(n)) return '0';
      return Number(n.toFixed(6)).toLocaleString('zh-TW', { maximumFractionDigits: 6 });
    }

    // --- Resize Image to <= 1024px JPEG for Fast Mobile Upload ---
    function resizeImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('讀取圖片失敗'));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error('無效的圖片格式'));
          img.onload = () => {
            const maxDim = 800;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w >= h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            c.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(c.toDataURL('image/jpeg', 0.72));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // --- Sample Handwritten Note Generator ---
    function loadSampleImage() {
      const c = document.createElement('canvas');
      c.width = 640;
      c.height = 480;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fefce8';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.strokeRect(20, 20, 600, 440);

      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 44px "Comic Sans MS", "Noto Sans TC", sans-serif';
      ctx.fillText('50 × 15', 160, 145);
      ctx.fillText('11 × 14', 160, 245);
      ctx.fillText('20 × 22', 160, 345);

      state.imageDataUrl = c.toDataURL('image/jpeg', 0.9);
      el.previewImg.src = state.imageDataUrl;
      state.items = [
        { id: 'sample_1', expr: '50 × 15', value: 750, included: true, isManual: false },
        { id: 'sample_2', expr: '11 × 14', value: 154, included: true, isManual: false },
        { id: 'sample_3', expr: '20 × 22', value: 440, included: true, isManual: false },
      ];
      state.usedModel = '範例展示';
      renderItems();
      updateStats();
    }

    // --- Gemini Vision Call with Automatic Fallback ---
    async function recognizeWithGemini(dataUrl) {
      const base64Data = dataUrl.split(',')[1];
      const instruction = state.presetMode === 'exclude_date'
        ? '辨識圖片中每一行的手寫算式（如 50x15）或數值，並排除日期、電話與純流水編號'
        : '辨識圖片中每一行的手寫算式（如 50x15、11x14）或單獨數值';

      const prompt = `請仔細辨識這張圖片中「每一行」的手寫數學算式（例如 50x15、11×14、20*22、100+50、300÷2 等）或單獨的數值。
任務說明：${instruction}
規則：
1. 不要把算式拆成個別數字，請以「每一行算式」為一個項目。
2. 只回傳 JSON 陣列，不要任何多餘文字或 Markdown 標記。
3. 每個元素格式為 {"expression": "算式字串", "value": 計算結果}。
   - 例如圖片寫「50 x 15」，請回傳 {"expression": "50 * 15", "value": 750}。
   - 乘號請統一寫成 *，除號寫成 /，不要包含等號、單位或逗號。
   - 若該行只有單一數字（沒有運算符號），expression 請直接填該數字字串。
4. value 必須是純數字（支援小數${state.allowNegative ? '與負數' : '，不取負號'}）。`;

      let lastErr = null;
      for (const model of MODELS) {
        const payload = {
          contents: [{
            parts: [
              { text: prompt },
              { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
            ]
          }],
          generationConfig: {
            responseMimeType: 'application/json',
            thinkingConfig: {
              thinkingLevel: model === 'gemini-3.8-flash' ? 'LOW' : 'MINIMAL'
            }
          }
        };

        el.progressLabel.textContent = `正在使用 ${model} 極速辨識算式...`;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 20000);

        try {
          const resp = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(state.apiKey)}`,
            {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              signal: controller.signal,
            }
          );
          clearTimeout(timer);

          if (resp.ok) {
            const data = await resp.json();
            const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
            const cleaned = rawText.trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();
            const arr = JSON.parse(cleaned);
            state.usedModel = model;

            return (Array.isArray(arr) ? arr : []).reduce((acc, entry, idx) => {
              const exprRaw = String(entry?.expression ?? entry?.label ?? '').trim();
              let val = evaluateExpression(exprRaw);
              if (val === null && entry?.value !== undefined) {
                const parsed = Number(String(entry.value).replace(/,/g, ''));
                if (Number.isFinite(parsed)) val = parsed;
              }
              if (val === null || !Number.isFinite(val)) return acc;
              if (!state.allowNegative && val < 0) val = Math.abs(val);

              acc.push({
                id: `ai_${Date.now()}_${idx}`,
                expr: exprRaw ? formatExpressionDisplay(exprRaw) : String(val),
                value: val,
                included: true,
                isManual: false,
              });
              return acc;
            }, []);
          }

          let errMsg = `HTTP ${resp.status}`;
          try {
            const errJson = await resp.json();
            errMsg = errJson?.error?.message || errMsg;
          } catch (_) {}

          const lower = errMsg.toLowerCase();
          const retryable = resp.status === 429 || resp.status >= 500 ||
            lower.includes('high demand') || lower.includes('overloaded') ||
            lower.includes('unavailable') || lower.includes('not found');

          if (!retryable) throw new Error(errMsg);
          lastErr = new Error(`[${model}] ${errMsg}`);
        } catch (err) {
          clearTimeout(timer);
          if (err.name === 'AbortError') {
            lastErr = new Error(`[${model}] 連線逾時`);
          } else if (err.message && !err.message.startsWith('[')) {
            throw err;
          } else {
            lastErr = err;
          }
        }
      }
      throw lastErr || new Error('所有備援模型皆忙碌中，請稍後再試');
    }

    // --- Offline Tesseract Fallback ---
    async function recognizeOffline(dataUrl) {
      if (typeof Tesseract === 'undefined') {
        throw new Error('離線 OCR 引擎尚未載入完成');
      }
      el.progressLabel.textContent = '正在執行離線 OCR 辨識...';
      const worker = await Tesseract.createWorker('eng', 1, {
        logger: (m) => {
          if (m && typeof m.progress === 'number') {
            const pct = Math.round(m.progress * 100);
            el.progressPct.textContent = `${pct}%`;
            el.progressBar.style.width = `${pct}%`;
          }
        }
      });
      const res = await worker.recognize(dataUrl);
      await worker.terminate();

      const lines = (res?.data?.text || '').split(/\r?\n/);
      const out = [];
      state.usedModel = '離線 OCR';

      lines.forEach((line, idx) => {
        const cleaned = line.trim();
        if (!cleaned) return;
        const val = evaluateExpression(cleaned);
        if (val !== null) {
          out.push({
            id: `ocr_${Date.now()}_${idx}`,
            expr: formatExpressionDisplay(cleaned),
            value: (!state.allowNegative && val < 0) ? Math.abs(val) : val,
            included: true,
            isManual: false,
          });
        }
      });
      return out;
    }

    async function runRecognition() {
      if (!state.imageDataUrl || state.isProcessing) return;
      if (state.useAi && !state.apiKey) {
        openApiModal();
        showToast('請先設定免費的 Gemini API Key', 'info');
        return;
      }

      state.isProcessing = true;
      el.progressWrap.classList.remove('hidden');
      el.progressBar.style.width = '60%';
      el.progressPct.textContent = '處理中';

      try {
        const results = state.useAi
          ? await recognizeWithGemini(state.imageDataUrl)
          : await recognizeOffline(state.imageDataUrl);

        state.items = results;
        renderItems();
        updateStats();

        if (results.length > 0) {
          showToast(`辨識完成！共計算 ${results.length} 筆算式`, 'success');
        } else {
          showToast('未偵測到明確算式，可點擊「+ 新增」手動補登', 'info');
        }
      } catch (err) {
        showToast(`辨識失敗：${err.message}`, 'error');
      } finally {
        state.isProcessing = false;
        el.progressWrap.classList.add('hidden');
      }
    }

    async function handleFileSelect(file) {
      if (!file || !file.type.startsWith('image/')) {
        showToast('請選擇有效的圖片檔案', 'error');
        return;
      }
      try {
        const resized = await resizeImageFile(file);
        state.imageDataUrl = resized;
        el.previewImg.src = resized;
        await runRecognition();
      } catch (err) {
        showToast(err.message || '圖片讀取失敗', 'error');
      }
    }

    // --- UI Rendering ---
    function updateStats() {
      const included = state.items.filter((it) => it.included && Number.isFinite(it.value));
      const sum = included.reduce((acc, it) => acc + it.value, 0);
      el.totalSumDisplay.textContent = formatNum(sum);
      el.statCount.textContent = `納入計算：${included.length} / ${state.items.length} 筆算式`;
      el.statModel.textContent = state.usedModel ? `引擎：${state.usedModel}` : '';
    }

    function renderItems() {
      if (state.items.length === 0) {
        el.itemsList.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">尚未偵測到算式，請拍照、選圖或上方手動新增</div>`;
        return;
      }

      el.itemsList.innerHTML = state.items.map((item, idx) => `
        <div data-id="${item.id}" class="px-4 py-3 flex items-center gap-2.5 hover:bg-slate-50 transition">
          <input type="checkbox" class="item-toggle w-4 h-4 rounded accent-indigo-600 cursor-pointer shrink-0" ${item.included ? 'checked' : ''} />
          <span class="text-xs text-slate-400 tabular-nums w-5 shrink-0">#${idx + 1}</span>
          <input type="text" value="${item.expr}" class="item-expr flex-1 min-w-0 rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 ${!item.included ? 'line-through text-slate-400 bg-slate-50' : 'bg-white'}" />
          <span class="text-sm font-bold tabular-nums text-indigo-700 shrink-0">= ${formatNum(item.value)}</span>
          <button type="button" class="item-delete p-1.5 text-slate-400 hover:text-rose-600 transition shrink-0" title="刪除">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');

      if (window.lucide) lucide.createIcons();
    }

    // --- Event Listeners ---
    function openApiModal() {
      el.apiKeyInput.value = state.apiKey;
      el.apiModal.classList.remove('hidden');
      el.apiKeyInput.focus();
    }
    function closeApiModal() {
      el.apiModal.classList.add('hidden');
    }

    el.btnOpenApiModal.addEventListener('click', openApiModal);
    el.btnCloseModal.addEventListener('click', closeApiModal);
    el.btnCancelModal.addEventListener('click', closeApiModal);
    el.btnSaveApiKey.addEventListener('click', () => {
      const val = el.apiKeyInput.value.trim();
      if (!val) {
        showToast('請輸入有效的 Gemini API Key', 'error');
        return;
      }
      saveApiKey(val);
      closeApiModal();
      showToast('API Key 已儲存', 'success');
    });

    function updateModeUi() {
      if (state.useAi) {
        el.btnModeAi.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
        el.btnModeAi.classList.remove('text-slate-600');
        el.btnModeOcr.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
        el.btnModeOcr.classList.add('text-slate-600');
        el.aiFilterRow.classList.remove('hidden');
      } else {
        el.btnModeOcr.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
        el.btnModeOcr.classList.remove('text-slate-600');
        el.btnModeAi.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
        el.btnModeAi.classList.add('text-slate-600');
        el.aiFilterRow.classList.add('hidden');
      }
    }

    el.btnModeAi.addEventListener('click', () => { state.useAi = true; updateModeUi(); });
    el.btnModeOcr.addEventListener('click', () => { state.useAi = false; updateModeUi(); });

    el.chipAll.addEventListener('click', () => {
      state.presetMode = 'all';
      el.chipAll.className = 'px-2.5 py-1 rounded-full font-medium bg-indigo-50 text-indigo-700 border border-indigo-200';
      el.chipExcludeDate.className = 'px-2.5 py-1 rounded-full font-medium bg-slate-50 text-slate-600 border border-slate-200';
    });
    el.chipExcludeDate.addEventListener('click', () => {
      state.presetMode = 'exclude_date';
      el.chipExcludeDate.className = 'px-2.5 py-1 rounded-full font-medium bg-indigo-50 text-indigo-700 border border-indigo-200';
      el.chipAll.className = 'px-2.5 py-1 rounded-full font-medium bg-slate-50 text-slate-600 border border-slate-200';
    });
    el.chkAllowNegative.addEventListener('change', (e) => {
      state.allowNegative = e.target.checked;
    });

    el.cameraInput.addEventListener('change', (e) => {
      if (e.target.files?.[0]) handleFileSelect(e.target.files[0]);
      e.target.value = '';
    });
    el.galleryInput.addEventListener('change', (e) => {
      if (e.target.files?.[0]) handleFileSelect(e.target.files[0]);
      e.target.value = '';
    });

    el.dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      el.dropZone.classList.add('ring-2', 'ring-indigo-500');
    });
    el.dropZone.addEventListener('dragleave', () => {
      el.dropZone.classList.remove('ring-2', 'ring-indigo-500');
    });
    el.dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      el.dropZone.classList.remove('ring-2', 'ring-indigo-500');
      if (e.dataTransfer.files?.[0]) handleFileSelect(e.dataTransfer.files[0]);
    });
    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const it of items) {
        if (it.type.startsWith('image/')) {
          handleFileSelect(it.getAsFile());
          break;
        }
      }
    });

    el.btnRunAgain.addEventListener('click', runRecognition);
    el.btnSample.addEventListener('click', loadSampleImage);

    el.itemsList.addEventListener('click', (e) => {
      const row = e.target.closest('[data-id]');
      if (!row) return;
      const id = row.getAttribute('data-id');
      const item = state.items.find((x) => x.id === id);
      if (!item) return;

      if (e.target.closest('.item-delete')) {
        state.items = state.items.filter((x) => x.id !== id);
        renderItems();
        updateStats();
      } else if (e.target.classList.contains('item-toggle')) {
        item.included = e.target.checked;
        renderItems();
        updateStats();
      }
    });

    el.itemsList.addEventListener('input', (e) => {
      if (!e.target.classList.contains('item-expr')) return;
      const row = e.target.closest('[data-id]');
      if (!row) return;
      const id = row.getAttribute('data-id');
      const item = state.items.find((x) => x.id === id);
      if (!item) return;

      item.expr = e.target.value;
      const val = evaluateExpression(e.target.value);
      if (val !== null) {
        item.value = (!state.allowNegative && val < 0) ? Math.abs(val) : val;
        const resultSpan = row.querySelector('span.text-indigo-700');
        if (resultSpan) resultSpan.textContent = `= ${formatNum(item.value)}`;
        updateStats();
      }
    });

    el.manualAddForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const raw = el.manualExprInput.value.trim();
      const val = evaluateExpression(raw);
      if (val === null) {
        showToast('請輸入有效的數字或算式（例如 50x15）', 'error');
        return;
      }
      state.items.push({
        id: `manual_${Date.now()}`,
        expr: formatExpressionDisplay(raw),
        value: (!state.allowNegative && val < 0) ? Math.abs(val) : val,
        included: true,
        isManual: true,
      });
      el.manualExprInput.value = '';
      renderItems();
      updateStats();
    });

    el.btnToggleAll.addEventListener('click', () => {
      if (state.items.length === 0) return;
      const allOn = state.items.every((x) => x.included);
      state.items.forEach((x) => { x.included = !allOn; });
      renderItems();
      updateStats();
    });

    el.btnCopySum.addEventListener('click', async () => {
      const raw = el.totalSumDisplay.textContent.replace(/,/g, '');
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(raw);
        } else {
          const ta = document.createElement('textarea');
          ta.value = raw;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
        }
        showToast(`已複製總和：${raw}`, 'success');
      } catch (_) {
        showToast('複製失敗，請手動選取總和', 'error');
      }
    });

    el.btnExportCsv.addEventListener('click', () => {
      if (state.items.length === 0) {
        showToast('目前沒有可匯出的算式明細', 'info');
        return;
      }
      const rows = [['項次', '算式', '計算結果', '納入加總']];
      state.items.forEach((it, idx) => {
        rows.push([idx + 1, `"${it.expr}"`, it.value, it.included ? '是' : '否']);
      });
      const sum = state.items.filter((x) => x.included).reduce((a, b) => a + b.value, 0);
      rows.push(['總和', '', sum, '']);
      const csv = '\uFEFF' + rows.map((r) => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `formula_sum_${Date.now()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已匯出 CSV 明細檔', 'success');
    });

    // --- Live Rear Camera (getUserMedia with iOS playsinline support) ---
    let activeStream = null;
    const cameraModal = document.getElementById('cameraModal');
    const cameraVideo = document.getElementById('cameraVideo');
    const btnOpenCamera = document.getElementById('btnOpenCamera');
    const btnCloseCamera = document.getElementById('btnCloseCamera');
    const btnCapturePhoto = document.getElementById('btnCapturePhoto');

    function stopCameraStream() {
      if (activeStream) {
        activeStream.getTracks().forEach((t) => t.stop());
        activeStream = null;
      }
      cameraVideo.srcObject = null;
      cameraModal.classList.add('hidden');
    }

    btnOpenCamera.addEventListener('click', async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        el.cameraInput.click();
        return;
      }
      try {
        activeStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false,
        });
        cameraVideo.srcObject = activeStream;
        cameraModal.classList.remove('hidden');
        if (window.lucide) lucide.createIcons();
      } catch (_) {
        // Fallback to native file/camera picker if permission denied or unavailable
        el.cameraInput.click();
      }
    });

    btnCloseCamera.addEventListener('click', stopCameraStream);

    btnCapturePhoto.addEventListener('click', async () => {
      if (!cameraVideo.videoWidth || !cameraVideo.videoHeight) return;
      const maxDim = 800;
      let w = cameraVideo.videoWidth;
      let h = cameraVideo.videoHeight;
      if (w > maxDim || h > maxDim) {
        if (w >= h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      c.getContext('2d').drawImage(cameraVideo, 0, 0, w, h);
      const dataUrl = c.toDataURL('image/jpeg', 0.72);
      stopCameraStream();
      state.imageDataUrl = dataUrl;
      el.previewImg.src = dataUrl;
      await runRecognition();
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      loadApiKey();
      loadSampleImage();
    });
  </script>
</body>
</html>
